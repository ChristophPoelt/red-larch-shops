<html lang="de">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: {
                            light: '#f9f3e3',
                            DEFAULT: '#f1e4c3',
                            dark: '#e3cfa1',
                            border: '#a68a56'
                        },
                        ink: {
                            light: '#5c4033',
                            DEFAULT: '#3e2723',
                            dark: '#1a100e'
                        },
                        coin: {
                            gp: '#d4af37',
                            sp: '#9ca3af', /* Adjusted slightly for better contrast */
                            cp: '#b87333'
                        }
                    },
                    fontFamily: {
                        fantasy: ['Cinzel', 'serif'],
                        body: ['Lora', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f1e4c3;
            background-image: 
                radial-gradient(circle at center, transparent 40%, rgba(139, 90, 43, 0.15) 100%),
                url('https://www.transparenttextures.com/patterns/aged-paper.png');
            color: #3e2723;
        }

        /* Custom Scrollbar for the whole page and mobile nav */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 228, 195, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #a68a56;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b5a2b;
        }

        /* Nav Item Styles */
        .nav-btn {
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        .nav-btn.active {
            background-color: #f9f3e3;
            border-color: #8b5a2b;
            color: #1a100e;
            box-shadow: 0 4px 6px -1px rgba(139, 90, 43, 0.2);
        }
        .nav-btn.active::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: #8b5a2b;
            border-radius: 2px 0 0 2px;
        }
        
        @media (max-width: 767px) {
            .nav-btn.active::before {
                left: 0;
                right: 0;
                top: auto;
                bottom: -2px;
                width: 100%;
                height: 4px;
                border-radius: 0 0 2px 2px;
            }
        }

        /* Card Styles */
        .item-card {
            background: linear-gradient(135deg, #f9f3e3 0%, #f1e4c3 100%);
            border: 2px solid #a68a56;
            box-shadow: 2px 4px 8px rgba(62, 39, 35, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 4px 8px 15px rgba(62, 39, 35, 0.25);
            border-color: #8b5a2b;
        }
        .item-sketch {
            background-color: #fcf8f2;
            border: 1px solid #d4c4a8;
            box-shadow: inset 0 0 10px rgba(139, 90, 43, 0.05);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>

        function renderNavigation() {
            const navContainer = document.getElementById('shop-nav');
            navContainer.innerHTML = '';

            Object.values(shopsData).forEach(shop => {
                const button = document.createElement('button');
                const isActive = shop.id === currentShopId;
                
                button.className = `nav-btn w-full text-left px-4 py-3 border-b md:border-b-0 md:border-l-2 border-parchment-border bg-parchment bg-opacity-40 hover:bg-parchment-light rounded flex flex-col snap-start min-w-[200px] md:min-w-0 ${isActive ? 'active font-bold' : 'text-ink-light'}`;
                
                button.onclick = () => {
                    switchShop(shop.id);
                    // On mobile, smooth scroll the clicked tab into view
                    if(window.innerWidth < 768) {
                        button.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                };
                
                button.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 flex justify-center text-xl ${isActive ? 'text-amber-700' : 'text-ink-light opacity-70'}">
                            <i class="fa-solid ${shop.icon}"></i>
                        </div>
                        <div class="flex-grow">
                            <div class="font-fantasy tracking-wide text-sm md:text-base leading-tight">${shop.name}</div>
                            <div class="text-[10px] md:text-xs uppercase opacity-70 mt-0.5 tracking-wider">${shop.type}</div>
                        </div>
                    </div>
                `;
                
                navContainer.appendChild(button);
            });

        function getCurrencyStyles(currency) {
            switch(currency) {
                case 'gp': return { label: 'GM', iconClass: 'text-coin-gp drop-shadow-[0_1px_1px_rgba(0,0,0,0.5)]', borderClass: 'border-yellow-600', bgClass: 'bg-yellow-50' };
                case 'sp': return { label: 'SM', iconClass: 'text-coin-sp drop-shadow-[0_1px_1px_rgba(0,0,0,0.5)]', borderClass: 'border-gray-500', bgClass: 'bg-gray-50' };
                case 'cp': return { label: 'KM', iconClass: 'text-coin-cp drop-shadow-[0_1px_1px_rgba(0,0,0,0.5)]', borderClass: 'border-orange-700', bgClass: 'bg-orange-50' };
                default: return { label: 'GM', iconClass: 'text-coin-gp', borderClass: 'border-yellow-500', bgClass: 'bg-yellow-50' };
            }
        }

        function renderShopContent() {
            const container = document.getElementById('main-content');
            const shop = shopsData[currentShopId];

            // Re-trigger animation
            container.classList.remove('animate-fade-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('animate-fade-in');

            let html = `
                <div class="bg-parchment-light border-2 border-parchment-border p-5 md:p-8 rounded-lg shadow-sm mb-6 relative overflow-hidden group">
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity duration-500 transform rotate-[-15deg] pointer-events-none">
                        <i class="fa-solid ${shop.icon} text-9xl"></i>
                    </div>
                    <div class="relative z-10">
                        <h2 class="font-fantasy text-3xl md:text-4xl font-bold text-ink-dark mb-1 flex items-center gap-3">
                            <i class="fa-solid ${shop.icon} text-amber-700 text-2xl md:text-3xl"></i>
                            ${shop.name}
                        </h2>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="bg-amber-900 bg-opacity-10 text-amber-900 px-3 py-1 rounded text-xs font-bold uppercase tracking-wider">${shop.type}</span>
                            <span class="text-sm font-bold text-ink-light">Inhaber: ${shop.owner}</span>
                        </div>
                        <p class="text-base md:text-lg text-ink leading-relaxed border-l-4 border-amber-700 pl-4 italic">
                            "${shop.description}"
                        </p>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6">
            `;

            shop.items.forEach((item, index) => {
                const currStyle = getCurrencyStyles(item.currency);
                const animDelay = index * 0.05;

                // Fallback for missing fa-axe in free tier is fa-hammer, handling that implicitly via class input or providing safe strings above.
                html += `
                    <div class="item-card rounded-lg overflow-hidden flex flex-col" style="animation: slideUp 0.3s ease-out ${animDelay}s both;">
                        <div class="item-sketch h-32 md:h-40 m-2 mb-0 rounded flex items-center justify-center relative overflow-hidden group/sketch">
                            <i class="fa-solid ${item.icon} text-5xl md:text-6xl text-ink-light opacity-60 group-hover/sketch:scale-110 transition-transform duration-300"></i>
                            <div class="absolute inset-0 bg-gradient-to-t from-[#8b5a2b22] to-transparent opacity-0 group-hover/sketch:opacity-100 transition-opacity duration-300"></div>
                        </div>
                        
                        <div class="p-4 flex flex-col flex-grow">
                            <h3 class="font-fantasy text-lg md:text-xl font-bold text-ink-dark leading-tight mb-2">${item.name}</h3>
                            <p class="text-xs md:text-sm text-ink-light flex-grow leading-snug mb-4">${item.desc}</p>
                            
                            <div class="flex items-center justify-between border-t border-parchment-border pt-3 mt-auto">
                                <span class="text-xs font-bold text-ink uppercase tracking-wide">Preis</span>
                                <div class="flex items-center gap-1.5 ${currStyle.bgClass} px-2 md:px-3 py-1 rounded-full border ${currStyle.borderClass} shadow-inner">
                                    <span class="font-bold text-base md:text-lg text-ink-dark leading-none">${item.price}</span>
                                    <i class="fa-solid fa-coins ${currStyle.iconClass} text-sm md:text-base"></i>
                                    <span class="font-bold text-xs md:text-sm text-ink-dark leading-none">${currStyle.label}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function switchShop(shopId) {
            if (currentShopId === shopId) return;
            currentShopId = shopId;
            renderNavigation();
            renderShopContent();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderNavigation();
            renderShopContent();
        });

    </script>
</body>
</html>
