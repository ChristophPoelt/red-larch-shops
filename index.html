<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Larch - Marktplatz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --parchment: #f4ecd8;
            --ink: #3e2a14;
            --accent: #8b0000;
            --gold: #d4af37;
            --silver: #9ca3af;
            --copper: #b87333;
        }
        body {
            background-color: #2c1e16;
            margin: 0;
            font-family: 'Lora', serif;
            color: var(--ink);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Sidebar */
        nav {
            background-color: #e6dac3;
            width: 320px;
            border-right: 3px solid #b89c72;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }
        nav h1 {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: 1.8rem;
            margin: 20px 0;
            color: var(--accent);
            padding: 0 15px;
        }
        .tab-container {
            overflow-y: auto;
            flex-grow: 1;
        }
        .tab-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px solid #d4c4a8;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background-color: #d4c4a8;
        }
        .tab-btn.active {
            background-color: #c2b296;
            font-weight: bold;
            border-left: 5px solid var(--accent);
        }

        /* Main Content */
        main {
            flex-grow: 1;
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/old-wall.png');
            padding: 40px;
            overflow-y: auto;
        }
        .shop-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .shop-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--accent);
            margin: 0 0 10px 0;
        }
        .shop-header .owner {
            font-style: italic;
            font-weight: 600;
            color: #5a4024;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .shop-header p {
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        /* Item Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 4px 4px 12px rgba(0,0,0,0.1);
        }
        .item-icon {
            font-size: 1.8rem;
            width: 60px;
            height: 60px;
            background-color: #e6dac3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: var(--ink);
            flex-shrink: 0;
            border: 2px solid #b89c72;
        }
        .item-details {
            flex-grow: 1;
        }
        .item-name {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .item-price {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .coin-gm { color: var(--gold); text-shadow: 1px 1px 1px #000; }
        .coin-sm { color: var(--silver); text-shadow: 1px 1px 1px #000; }
        .coin-km { color: var(--copper); text-shadow: 1px 1px 1px #000; }

        /* Mobile Responsive */
        @media (max-width: 800px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            nav {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 3px solid #b89c72;
            }
            .tab-container {
                display: flex;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                white-space: nowrap;
            }
            .tab-btn {
                flex: 0 0 auto;
                width: auto;
                border-bottom: none;
                border-right: 1px solid #d4c4a8;
                scroll-snap-align: start;
            }
            .tab-btn.active {
                border-left: none;
                border-bottom: 5px solid var(--accent);
            }
            main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

        function formatPrice(priceStr) {
            if (priceStr.includes("GM")) return `<span class="coin-gm">${priceStr}</span>`;
            if (priceStr.includes("SM")) return `<span class="coin-sm">${priceStr}</span>`;
            if (priceStr.includes("KM")) return `<span class="coin-km">${priceStr}</span>`;
            return priceStr;
        }

        function renderShop(shopId) {
            const shop = shops.find(s => s.id === shopId);
            const contentDiv = document.getElementById('shop-content');
            
            let itemsHtml = shop.items.map(item => `
                <div class="item-card">
                    <div class="item-icon"><i class="fa-solid ${item.icon}"></i></div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${formatPrice(item.price)}</div>
                    </div>
                </div>
            `).join('');

            contentDiv.innerHTML = `
                <div class="shop-header">
                    <h2>${shop.name.substring(shop.name.indexOf('.') + 2)}</h2>
                    <div class="owner">Inhaber: ${shop.owner}</div>
                    <p>${shop.desc}</p>
                </div>
                <div class="items-grid">
                    ${itemsHtml}
                </div>
            `;

            // Update Active Tab
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${shopId}`).classList.add('active');
        }

        // Initialize App
        const tabContainer = document.getElementById('shop-tabs');
        shops.forEach((shop, index) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.id = `tab-${shop.id}`;
            btn.innerText = shop.name;
            btn.onclick = () => renderShop(shop.id);
            tabContainer.appendChild(btn);
        });

        // Load first shop by default
        if (shops.length > 0) {
            renderShop(shops[0].id);
        }
    </script>

</html>
